name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          # Node >= 24 is required for the built-in node:sqlite the server uses.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Backend tsc → dist/ and the Vite SPA build. build:server also serves as
      # the backend typecheck; build:web exercises the frontend bundler.
      - name: Build (server + web)
        run: npm run build

      # Frontend type-check (DOM lib + react-jsx tsconfig, --noEmit).
      - name: Type-check frontend
        run: npm run typecheck:web

      # Type-check the test files (tsx strips types at runtime, so the runner
      # alone wouldn't catch type errors in them).
      - name: Type-check tests
        run: npm run typecheck:test

      # node:test golden tests for the no-LLM data-prep core. No Ollama needed —
      # these cover deterministic parsing/chunking only.
      - name: Test
        run: npm test
